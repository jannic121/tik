<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TT Recorder</title>
<style>
  body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    margin:0; background:#1a1a1a; color:#e4e4e4; min-height:100vh;
    display:flex; align-items:center; justify-content:center; }
  .box { background:#262626; border:1px solid #383838; border-radius:8px;
    padding:32px 28px; width:360px; max-width:90vw; }
  h1 { font-size:20px; font-weight:600; margin:0 0 6px; }
  p { margin:0 0 22px; color:#999; font-size:13px; }
  label { display:block; font-size:13px; color:#c0c0c0; margin-bottom:14px; }
  input { width:100%; box-sizing:border-box; padding:9px 11px; margin-top:5px;
    background:#1a1a1a; color:#e4e4e4; border:1px solid #404040; border-radius:4px;
    font-size:13px; font-family:inherit; }
  input:focus { outline:none; border-color:#6b8afd; }
  button { width:100%; background:#4f6ef7; color:#fff; border:none;
    padding:10px 18px; border-radius:4px; font-size:14px; font-weight:500; cursor:pointer; }
  button:hover { background:#3d59e0; }
  .err { color:#f87171; font-size:12px; min-height:16px; margin-top:10px; }
</style>
</head>
<body>
<div class="box">
  <h1>TT Recorder</h1>
  <p>Sign in to continue.</p>
  <label>Password<input id="pw" type="password" autofocus /></label>
  <button onclick="go()">Sign in</button>
  <div class="err" id="err"></div>
</div>
<script>
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
async function go(){
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:document.getElementById('pw').value})});
  if(r.ok){window.location='/';return;}
  document.getElementById('err').textContent=r.status===401?'Wrong password':`Error ${r.status}`;
}
</script>
</body>
</html>
